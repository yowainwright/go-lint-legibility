name: Update dependencies

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    name: Update Go modules and GitHub Actions
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Codependence
        run: brew install yowainwright/tap/codependence

      - name: Update dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/update-dependencies.sh

      - name: Create pull request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.CODEPENDENCE_TOKEN }}
          branch: update-dependencies
          delete-branch: true
          title: "chore: update dependencies"
          commit-message: "chore: update dependencies"
          body: "Automated updates for Go modules and GitHub Actions."
