[tools]
go = "1.27.4"
golangci-lint = "2.15.0"
svu = "3.4.4"

[tasks.check]
description = "Run all validation"
run = "make check"

[tasks.next-version]
description = "Print the next semantic version"
run = "svu next"

[tasks.release]
description = "Publish a release using the commit history or an explicit version bump"
usage = '''
arg "[bump]" help="Choose the version bump" {
  choices "patch" "minor" "major"
}
'''
depends = ["check"]
run = '''
set -eu
branch="$(git branch --show-current)"
if [ "$branch" != "main" ]; then
  echo "release must run from main (on $branch)" >&2
  exit 1
fi
if [ -n "$(git status --porcelain --untracked-files=normal)" ]; then
  echo "working tree is dirty" >&2
  exit 1
fi
git fetch --tags origin main
if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
  echo "local main is not in sync with origin/main" >&2
  exit 1
fi
current="$(svu current)"
if [ -n "${usage_bump:-}" ]; then
  version="$(svu "$usage_bump")"
elif [ -n "${RELEASE_VERSION:-}" ]; then
  version="$RELEASE_VERSION"
  patch="$(svu patch)"
  minor="$(svu minor)"
  major="$(svu major)"
  if [ "$version" != "$patch" ] && [ "$version" != "$minor" ] && [ "$version" != "$major" ]; then
    echo "RELEASE_VERSION must be $patch, $minor, or $major" >&2
    exit 1
  fi
else
  version="$(svu next)"
fi
if [ "$version" = "$current" ]; then
  echo "No automatic bump after $current. Choose release:patch, release:minor, or release:major." >&2
  exit 1
fi
echo "tagging $version"
git tag -m "Release $version" "$version"
git push origin "$version"
'''

[tasks."release:patch"]
depends = ["release patch"]

[tasks."release:minor"]
depends = ["release minor"]

[tasks."release:major"]
depends = ["release major"]
