[tools]
go = "1.25.0"
golangci-lint = "2.12.2"
svu = "3.4.0"

[tasks.check]
description = "Run all validation"
run = "make check"

[tasks.next-version]
description = "Print the next semantic version"
run = "svu next"

[tasks.release]
description = "Validate, tag the next version, and push the tag"
depends = ["check"]
run = '''
set -eu
branch="$(git branch --show-current)"
if [ "$branch" != "main" ]; then
  echo "release must run from main (on $branch)" >&2
  exit 1
fi
if ! git diff --quiet || ! git diff --cached --quiet; then
  echo "working tree is dirty" >&2
  exit 1
fi
git fetch origin main
if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
  echo "local main is not in sync with origin/main" >&2
  exit 1
fi
version="$(svu next)"
echo "tagging $version"
git tag "$version"
git push origin "$version"
'''
